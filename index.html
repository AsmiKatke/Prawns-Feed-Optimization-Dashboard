<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Prawn Feed Optimization Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css"
    />
    <style>
      #spinner {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0f172a;
        color: #ffffff;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      .loader {
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="spinner">
        <div class="loader"></div>
        <h2>Loading Prawn Feed Optimization Dashboard...</h2>
        <p style="color: #94a3b8; font-size: 14px;">Running Streamlit in WebAssembly via stlite</p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      fetch('app.py')
        .then(response => response.text())
        .then(appCode => {
          stlite.mount(
            {
              requirements: ["pandas"],
              entrypoint: "app.py",
              files: {
                "app.py": appCode
              },
              streamlitConfig: {
                "theme.base": "light",
                "theme.primaryColor": "#0ea5e9",
                "theme.backgroundColor": "#f8fafc",
                "theme.secondaryBackgroundColor": "#0f172a",
                "theme.textColor": "#0f172a"
              }
            },
            document.getElementById("root")
          );
        })
        .catch(err => {
          console.error("Failed to load app.py", err);
          document.getElementById("root").innerHTML = `
            <div style="padding: 20px; color: red; font-family: sans-serif;">
              <h3>Error loading application</h3>
              <p>${err.message}</p>
            </div>
          `;
        });
    </script>
  </body>
</html>
